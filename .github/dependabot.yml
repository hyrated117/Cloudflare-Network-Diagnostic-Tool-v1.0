# Keeps the actions in .github/workflows current. release.yml pins each action to a
# commit SHA with its release in a comment, so an update has to move both; Dependabot
# rewrites the SHA and the comment together, which is why its PRs are the only
# sanctioned way to change a pin.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Neither package.json has a dependency today, but both lockfiles are committed, so
  # this is where a dependency would be added or bumped, and where an advisory would
  # arrive as a PR rather than as a red audit job with no commit to blame.
  - package-ecosystem: "npm"
    directories:
      - "/installers"
      - "/server"
    schedule:
      interval: "weekly"
