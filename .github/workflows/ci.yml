name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check syntax
        run: |
          node --check server/index.js
          node --check installers/cli.js
          python -m compileall -q server installers Tools
          for script in installers/*.sh Tools/*.sh; do
            bash -n "$script"
          done

      - name: Run Python MCP smoke test
        run: python server/smoke_test.py

      # Both servers implement one MCP surface; this fails when they diverge.
      - name: Compare the Python and Node servers
        run: python Tools/check-conformance.py

      - name: Validate JSON files
        run: python Tools/validate-json.py .

      - name: Check documentation links
        run: python Tools/check-links.py

      - name: Check installer MCP configs
        run: python Tools/check-installers.py

  package:
    name: Validate release package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Same script release.yml runs, so a packaging change breaks here first.
      - name: Build release archive
        run: Tools/build-package.sh v0.0.0-ci

      - name: Check archive contents and extract
        run: python Tools/check-archive.py dist/v0.0.0-ci/mcp-installer-pack.tar.gz --extract-to dist/pack

      - name: Install from the extracted archive and handshake
        run: python Tools/check-installers.py --installers-root dist/pack

      - name: Upload the archive for the Windows job
        uses: actions/upload-artifact@v4
        with:
          name: mcp-installer-pack
          path: dist/v0.0.0-ci/
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Validate Windows installers
    needs: package
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path installers -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::$($errors[0].Message)"
            }
          }
          if ($failed) { exit 1 }

      # A real trace, so the tracert path is exercised instead of only handshaked.
      - name: Trace a route with tracert
        shell: pwsh
        run: python Tools/check-conformance.py --live-trace 127.0.0.1

      - name: Check installer MCP configs
        shell: pwsh
        run: ./Tools/check-installers.ps1

      # Test the bytes the Linux job built, not a second build of the same sources.
      - name: Download the release archive built on Linux
        uses: actions/download-artifact@v4
        with:
          name: mcp-installer-pack
          path: dist/v0.0.0-ci

      # Same archive contract as Linux, then the packaged PowerShell installers.
      - name: Check archive checksum and extract
        run: python Tools/check-archive.py dist/v0.0.0-ci/mcp-installer-pack.tar.gz --extract-to dist/pack --expect-checksum

      - name: Install from the extracted archive and handshake
        shell: pwsh
        run: ./Tools/check-installers.ps1 -InstallersRoot dist/pack
