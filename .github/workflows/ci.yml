name: CI

on:
  # Main only: a pull request already runs every job below for its branch, so triggering
  # on every branch push ran each check twice for the same commit. A tag runs them once,
  # through release.yml's `checks` job, and is not covered by either trigger.
  push:
    branches: [ main ]
  pull_request:
  # A branch without a pull request yet (before the PR exists, or a maintenance branch)
  # can still be checked from the Actions tab with "Run workflow".
  workflow_dispatch:
  # release.yml calls this workflow so a tag cannot publish a commit CI has not passed.
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request cancels the run it superseded instead of paying
# for both. Push and dispatch runs are left alone, and so is release.yml's `checks` job
# (which calls this workflow on a tag), so a release cannot be interrupted by a second
# event. Every job below also has a timeout: without one a hung download or network
# trace holds a runner for the six-hour default.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commit SHAs with their release in a trailing comment, so a
# moved or re-tagged action cannot change what runs here. .github/dependabot.yml opens
# a weekly github-actions PR that moves the SHA and the comment together. The actionlint
# step is an image, pinned by digest because a tag can be moved; the check enforces both.
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Check syntax
        run: |
          node --check server/index.js
          node --check installers/cli.js
          python -m compileall -q server installers Tools
          for script in installers/*.sh Tools/*.sh; do
            bash -n "$script"
          done

      - name: Run Python MCP smoke test
        run: python server/smoke_test.py

      # Both servers implement one MCP surface; this fails when they diverge.
      - name: Compare the Python and Node servers
        run: python Tools/check-conformance.py

      - name: Check version consistency
        run: python Tools/check-version.py

      - name: Validate JSON files
        run: python Tools/validate-json.py .

      # GitHub only reads dependabot.yml from the default branch and reports nothing
      # when it is wrong, so the config is parsed here instead of on the next update.
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check --quiet pyyaml==6.0.4

      - name: Check the Dependabot config
        run: python Tools/check-dependabot.py

      # Every rule has to reject a broken entry and accept a sound one, so a later
      # simplification cannot quietly widen what passes.
      - name: Self-test the Dependabot check
        run: python Tools/test_check_dependabot.py

      # Triggers, timeouts and pins all fail silently on GitHub, so each is asserted:
      # a `branches:` filter skips stacked pull requests, a job without a timeout
      # inherits six hours, and a tag-pinned action can move under a passing commit.
      - name: Check workflow triggers, timeouts, pins and continuations
        run: python Tools/check-workflows.py

      # Every rule has to fail the break GitHub would not report and stay quiet on a
      # workflow GitHub runs fine; this pins both halves per rule so a simplification
      # cannot give up either one.
      - name: Self-test the workflow checks
        run: python Tools/test_check_workflows.py

      # The audit needs the network, so it is not a CI step; its rules run here, offline,
      # so a change cannot quietly stop a wrong pin from failing.
      - name: Self-test the pin check
        run: python Tools/test_check_pins.py

      # The image itself is a 25 MiB download, so CI pins the check's rules, not the run.
      - name: Self-test the image check
        run: python Tools/test_check_actionlint_image.py

      # The Windows job was the only place the tracert branch ran; this forces it on
      # Linux with a shim, so the flags and the three outcomes are checked every PR.
      - name: Test the Windows tracert branch
        run: python Tools/test_windows_trace_route.py

      # A bump is one edit and one command only if the stamp is all-or-nothing and the
      # checker still fails a drift; both run against a temporary copy of the tree.
      - name: Self-test the version checks
        run: |
          python Tools/test_check_version.py
          python Tools/test_stamp_version.py

      # The archive is the release artifact, so its contract is tested against built
      # packs: a missing file, build junk, a half-bumped stamp or a bad SHA256SUMS
      # must each fail, and a sound pack must pass.
      - name: Self-test the archive check
        run: python Tools/test_check_archive.py

      - name: Check documentation links
        run: python Tools/check-links.py

      - name: Check installer MCP configs
        run: python Tools/check-installers.py

  package:
    name: Validate release package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # Same script release.yml runs, so a packaging change breaks here first.
      - name: Build release archive
        run: Tools/build-package.sh v0.0.0-ci

      - name: Check archive contents and extract
        run: python Tools/check-archive.py dist/v0.0.0-ci/mcp-installer-pack.tar.gz --extract-to dist/pack

      - name: Install from the extracted archive and handshake
        run: python Tools/check-installers.py --installers-root dist/pack

      - name: Upload the archive for the Windows job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-installer-pack
          path: dist/v0.0.0-ci/
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Validate Windows installers
    needs: package
    runs-on: windows-latest
    # The longest job: it runs a live tracert, which is the step most likely to hang.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path installers -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::$($errors[0].Message)"
            }
          }
          if ($failed) { exit 1 }

      # A real trace, so the tracert path is exercised instead of only handshaked.
      - name: Trace a route with tracert
        shell: pwsh
        run: python Tools/check-conformance.py --live-trace 127.0.0.1

      - name: Check installer MCP configs
        shell: pwsh
        run: ./Tools/check-installers.ps1

      # Test the bytes the Linux job built, not a second build of the same sources.
      - name: Download the release archive built on Linux
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mcp-installer-pack
          path: dist/v0.0.0-ci

      # Same archive contract as Linux, then the packaged PowerShell installers.
      - name: Check archive checksum and extract
        run: python Tools/check-archive.py dist/v0.0.0-ci/mcp-installer-pack.tar.gz --extract-to dist/pack --expect-checksum

      - name: Install from the extracted archive and handshake
        shell: pwsh
        run: ./Tools/check-installers.ps1 -InstallersRoot dist/pack

  lint:
    name: Lint workflows and shell
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Bundles shellcheck, so the shell in every `run:` block is checked too. Pinned by
      # the digest of the 1.7.12 multi-arch index: Docker Hub lets an owner repoint a tag.
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      # The runner image's shellcheck moves with the image, so it is pinned here the
      # same way actionlint is. The five scripts are clean at the default severity,
      # so any finding the pinned version reports is new.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: 0.11.0
          # sha256 of shellcheck-v0.11.0.linux.x86_64.tar.xz from the release assets.
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          ( cd "${RUNNER_TEMP}" && echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c - && tar -xf shellcheck.tar.xz )
          echo "${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}" >> "${GITHUB_PATH}"

      - name: Lint shell scripts
        run: |
          shellcheck --version
          shellcheck installers/*.sh Tools/*.sh
