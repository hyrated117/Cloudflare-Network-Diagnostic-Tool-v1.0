name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG (expected vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag exists and points to checked-out commit
        shell: bash
        run: |
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$tag_commit" != "$GITHUB_SHA" && "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "Release tag does not point to the triggering commit" >&2
            exit 1
          fi

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          previous_tag="$(git tag --merged "$RELEASE_TAG" --sort=-version:refname | grep -Fxv -- "$RELEASE_TAG" | head -n 1 || true)"
          if [[ -n "$previous_tag" ]]; then
            range="${previous_tag}..${RELEASE_TAG}"
          else
            range="${RELEASE_TAG}"
          fi
          git log --pretty=format:'- %s' "$range" > generated_notes.md
          printf '\n' >> generated_notes.md

          # Hand-written notes live beside the tag (release/v1.0.0/release-notes.md).
          # They are the release body; the generated commit list follows them.
          curated="release/${RELEASE_TAG}/release-notes.md"
          if [[ -s "$curated" ]]; then
            cat "$curated" > release_notes.md
            printf '\n## Commits\n\n' >> release_notes.md
            echo "Release body: $curated, followed by the generated commit list"
          else
            : > release_notes.md
            echo "::warning::$curated not found or empty, publishing the generated commit list only"
          fi
          cat generated_notes.md >> release_notes.md

      - name: Build distribution archive
        shell: bash
        run: |
          # Shared with the packaging CI job so both build the same archive.
          Tools/build-package.sh "${RELEASE_TAG}" "${PWD}/dist"
          cat "dist/${RELEASE_TAG}/SHA256SUMS"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release_notes.md
          files: |
            dist/${{ env.RELEASE_TAG }}/mcp-installer-pack.tar.gz
            dist/${{ env.RELEASE_TAG }}/SHA256SUMS
