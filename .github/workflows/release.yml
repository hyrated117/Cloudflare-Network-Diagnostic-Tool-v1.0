name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag exists and points to checked-out commit
        shell: bash
        run: |
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$tag_commit" != "$GITHUB_SHA" && "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "Release tag does not point to the triggering commit" >&2
            exit 1
          fi

      # VERSION, not the tag, names the archive: this refuses to publish a pack
      # whose directory says one thing and whose files say another. The tag is checked
      # here, not in a step of its own, because VERSION only exists after checkout.
      - name: Check the tag against VERSION
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: ${RELEASE_TAG} (expected vMAJOR.MINOR.PATCH with no suffix)" >&2
            exit 1
          fi
          if [[ ! -s VERSION ]]; then
            echo "::error::VERSION is missing or empty; it names the release archive" >&2
            exit 1
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION (${version}) is not MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [[ "${RELEASE_TAG#v}" != "$version" ]]; then
            echo "::error::tag ${RELEASE_TAG} disagrees with VERSION (${version}); bump VERSION or re-tag" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "Tag and VERSION agree on ${version}"

      # The stamping guard: the tag and VERSION can agree while a site was missed. This
      # also requires the changelog section and the curated release notes, because the
      # notes are the release body the next step publishes.
      - name: Check the version everywhere
        shell: bash
        run: python3 Tools/check-version.py

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          previous_tag="$(git tag --merged "$RELEASE_TAG" --sort=-version:refname | grep -Fxv -- "$RELEASE_TAG" | head -n 1 || true)"

          # Hand-written notes live beside the tag (release/v1.0.1/release-notes.md).
          # They are the release body. The generated commit list follows them, but only
          # when an earlier tag exists: `git log` on the first tag would list the whole
          # history instead of a release's commits. The step above requires the notes.
          curated="release/v${VERSION}/release-notes.md"
          cat "$curated" > release_notes.md
          if [[ -n "$previous_tag" ]]; then
            printf '\n## Commits\n\n' >> release_notes.md
            git log --pretty=format:'- %s' "${previous_tag}..${RELEASE_TAG}" >> release_notes.md
            printf '\n' >> release_notes.md
            echo "Release body: $curated, followed by commits since $previous_tag"
          else
            echo "::notice::No earlier tag, so the body is $curated with no generated commit list"
          fi

      - name: Build distribution archive
        shell: bash
        run: |
          # Shared with the packaging CI job so both build the same archive. The
          # version comes from VERSION, which the previous step matched to the tag.
          Tools/build-package.sh "${VERSION}" "${PWD}/dist"
          cat "dist/v${VERSION}/SHA256SUMS"

      # The same contract CI's package job applies to the same script's output, so a
      # release cannot publish a pack CI would reject.
      - name: Check the archive before publishing
        shell: bash
        run: |
          python3 Tools/check-archive.py "dist/v${VERSION}/mcp-installer-pack.tar.gz" --expect-checksum

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release_notes.md
          files: |
            dist/v${{ env.VERSION }}/mcp-installer-pack.tar.gz
            dist/v${{ env.VERSION }}/SHA256SUMS
