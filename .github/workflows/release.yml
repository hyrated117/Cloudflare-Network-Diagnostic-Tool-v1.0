name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine previous release tag
        id: previous_tag
        shell: bash
        run: |
          previous_tag="$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n 1 || true)"
          echo "tag=${previous_tag}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        shell: bash
        run: |
          if [ -n "${{ steps.previous_tag.outputs.tag }}" ]; then
            git log --pretty=format:'- %s' "${{ steps.previous_tag.outputs.tag }}..${GITHUB_SHA}" > release_notes.md
          else
            git log --pretty=format:'- %s' "${GITHUB_SHA}" > release_notes.md
          fi
          printf '\n' >> release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body_path: release_notes.md

  build-artifacts:
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Create distribution packages
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "release/v${version}"
          tar -czf "release/v${version}/mcp-installer-pack.tar.gz" installers server docs

      - name: Generate checksums
        working-directory: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd "v${version}"
          sha256sum mcp-installer-pack.tar.gz > SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: release/
