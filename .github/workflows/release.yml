name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG (expected vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag exists and points to checked-out commit
        shell: bash
        run: |
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$tag_commit" != "$GITHUB_SHA" && "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "Release tag does not point to the triggering commit" >&2
            exit 1
          fi

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          previous_tag="$(git tag --merged "$RELEASE_TAG" --sort=-version:refname | grep -Fxv -- "$RELEASE_TAG" | head -n 1 || true)"
          if [[ -n "$previous_tag" ]]; then
            git log --pretty=format:'- %s' "${previous_tag}..${RELEASE_TAG}" > release_notes.md
          else
            git log --pretty=format:'- %s' "${RELEASE_TAG}" > release_notes.md
          fi
          printf '\n' >> release_notes.md

      - name: Build distribution archive
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p "dist/v${version}"
          tar -czf "dist/v${version}/mcp-installer-pack.tar.gz" installers server docs
          tar -tzf "dist/v${version}/mcp-installer-pack.tar.gz" >/dev/null
          (
            cd "dist/v${version}"
            sha256sum mcp-installer-pack.tar.gz > SHA256SUMS
          )

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release_notes.md
          files: |
            dist/${{ env.RELEASE_TAG }}/mcp-installer-pack.tar.gz
            dist/${{ env.RELEASE_TAG }}/SHA256SUMS
