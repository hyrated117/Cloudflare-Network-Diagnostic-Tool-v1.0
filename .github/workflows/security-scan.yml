name: Security Scan

on:
  push:
    branches: [ main ]
  # Every pull request, whichever branch it targets, for the same reason as codeql.yml:
  # a stacked pull request's base is the branch below it, not main.
  pull_request:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: Audit Node.js dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [ installers, server ]

    steps:
      # Actions are pinned to commit SHAs with their release in a trailing comment, so a
      # moved tag cannot change what runs. .github/dependabot.yml moves both together.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # The lockfile is committed, so this audits the tree the repository actually
      # ships instead of one resolved fresh at audit time, which could report an
      # advisory against a version no commit ever contained. `npm ci` also fails when
      # the lockfile and package.json disagree, so a dependency edit cannot land
      # without the lockfile that goes with it.
      - name: Install from the committed lockfile
        working-directory: ${{ matrix.directory }}
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=moderate
