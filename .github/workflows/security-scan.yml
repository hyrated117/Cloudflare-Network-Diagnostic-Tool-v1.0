name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: Audit Node.js dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [ installers, server ]

    steps:
      # Actions are pinned to commit SHAs with their release in a trailing comment, so a
      # moved tag cannot change what runs. .github/dependabot.yml moves both together.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Generate lockfile and audit dependencies
        working-directory: ${{ matrix.directory }}
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=moderate
