name: Security Scan

on:
  push:
    branches: [ main ]
  # Every pull request, whichever branch it targets, for the same reason as codeql.yml:
  # a stacked pull request's base is the branch below it, not main.
  pull_request:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: Audit Node.js dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [ installers, server ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate lockfile and audit dependencies
        working-directory: ${{ matrix.directory }}
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=moderate
