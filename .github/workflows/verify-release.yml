name: Verify release

# The publishing job proves the archive is good *before* upload. Nothing proved the
# bytes GitHub then served: a truncated upload, a replaced asset or a checksum file
# that does not match the archive would only surface for a user. This downloads the
# published assets again and applies the same contract to them.
on:
  release:
    types: [ published ]
  # Re-run it for an already published release, for example after fixing a check: the
  # verifier is checked out from the default branch, so the fix applies retroactively.
  workflow_dispatch:
    inputs:
      tag:
        description: Published tag to verify (for example, v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify published assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # `gh release download` reads the API with this token; read access is enough.
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Check the tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: ${RELEASE_TAG} (expected vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "Verifying published release ${RELEASE_TAG}"

      # Both assets, by name: a release missing either one is already broken, and
      # check-archive.py needs SHA256SUMS beside the archive to apply the checksum.
      - name: Download the published assets
        shell: bash
        run: |
          mkdir -p "dist/v${VERSION}"
          gh release download "$RELEASE_TAG" \
            --pattern mcp-installer-pack.tar.gz \
            --pattern SHA256SUMS \
            --dir "dist/v${VERSION}"
          ls -l "dist/v${VERSION}"

      # Same contract release.yml applies before upload, now to the served bytes: the
      # checksum must cover this archive, the required files must be present, and the
      # version stamped inside must match the tag.
      - name: Check the published archive
        run: |
          python Tools/check-archive.py "dist/v${VERSION}/mcp-installer-pack.tar.gz" \
            --expect-checksum --extract-to dist/pack

      # The archive being intact is not the same as it being installable: this runs the
      # packaged installers against the extracted tree and requires the initialize
      # handshake, exactly as the packaging job does before upload.
      - name: Install from the published archive and handshake
        run: python Tools/check-installers.py --installers-root dist/pack
